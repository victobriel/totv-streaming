name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y gcc make pkg-config libx264-dev libopus-dev
      - run: make emu
      - run: go vet ./... && go test -race -count=1 ./...
