name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y build-essential make pkg-config libegl-dev libgl-dev libx264-dev libopus-dev
      - name: Compilar o host de emulacao (headers de kernel do runner, sem exigir Landlock novo)
        run: make emu
      - run: go vet ./...
      - name: Testes puros (sem GPU, ROM ou sandbox)
        run: go test -race -count=1 -run 'TestInput|TestSeqWraparound|TestButtonMapping|TestSaveZip|TestUnzip|TestZipSave|TestNormalizeROM|TestPixelFormats|TestContentBBox|TestN64VideoOptions|TestAuth|TestHealthContract|TestSessionValidation' ./...
      - name: Suite completa (os testes de sandbox se pulam sozinhos sem seccomp/Landlock/userns; GPU e ROM nao existem no runner)
        run: go test -race -count=1 ./...
        continue-on-error: true
